name: StockPilot continuous integration
on:
  pull_request:
    branches: [ "master" ]
jobs: 
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Node.js
        uses: actions/setup-node@v4
        # Added dependency caching to speed up the build process/pipeline with node version 20
        with:
          node-version: '20'
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: validate prisma schema
        run: npx prisma validate
      
      - name: Lint Code
        run: npm run lint
      
      - name: TypeScript type check
        run: npx tsc --noEmit
      # Typescript 
      - name: Run tests
        run: npm test
      - name: Test production build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock_user:mock_pass@localhost:5432/mock_db' }}